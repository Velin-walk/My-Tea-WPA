<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Flow PWA</title>
  <link rel="manifest" href="manifest.json">
  <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    :root {
      --primary: #4285f4; --success: #34a853; --danger: #ea4335; --warning: #fbbc05;
      --bg: #f8f9fa; --text: #202124; --cal-event: #00acc1;
    }
    body { font-family: 'Segoe UI', sans-serif; padding: 0; margin: 0; background: var(--bg); color: var(--text); }
    .dashboard-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 1350px; margin: 0 auto; padding: 20px; }
    @media (max-width: 1100px) { .dashboard-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 750px) { .dashboard-container { grid-template-columns: 1fr; padding: 10px; } }
    
    .card { background: white; width: 100%; max-width: 420px; margin: 0 auto; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; box-sizing: border-box; }
    .timer-card-horizontal { grid-column: 1 / -1; max-width: 100% !important; }
    
    h3 { margin: 0 0 15px 0; font-size: 14px; color: #5f6368; text-transform: uppercase; letter-spacing: 1px; }
    button { padding: 10px 20px; cursor: pointer; border: 1px solid #f0f0f0; border-radius: 16px; font-weight: 600; transition: all 0.3s; background: #fdfdfd; display: flex; align-items: center; gap: 8px; }
    button:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-start { color: var(--success); } .btn-stop { color: var(--danger); }
    
    input { padding: 8px; border: 2px solid #eee; border-radius: 8px; text-align: center; }

    /* Gauge & UI Elements */
    .gauge-wrapper { position: relative; width: 300px; height: 300px; margin: 0 auto; }
    .gauge-bg { fill: none; stroke: #f0f0f0; stroke-width: 60; }
    .gauge-liquid { fill: var(--primary); fill-opacity: 0.3; transition: all 1s; }
    .timer-running .gauge-liquid { animation: waveMove 3s infinite linear; fill-opacity: 0.6; }
    @keyframes waveMove { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    
    .cup-container { margin-left: 20px; position: relative; width: 45px; height: 35px; border: 3px solid #555; border-radius: 0 0 18px 18px; }
    .tea-fill { position: absolute; bottom: 0; left: 0; width: 100%; background: #D2691E; transition: height 0.5s; border-radius: 0 0 15px 15px; }
    
    .heatmap-grid { display: grid; grid-template-columns: repeat(26, 11px); gap: 3px; justify-content: center; }
    .heatmap-day { width: 11px; height: 11px; background: #eee; border-radius: 2px; }
    .lvl-1 { background: #9be9a8; } .lvl-2 { background: #40c463; } .lvl-3 { background: #30a14e; } .lvl-4 { background: #216e39; }

    .schedule-info { background: #f0f7ff; border-left: 4px solid var(--primary); padding: 12px; border-radius: 8px; margin: 12px 0; font-size: 13px; text-align: left; }
    .schedule-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 12px; }
    .schedule-study { background: var(--primary); color: white; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- TIMERS -->
    <div class="card timer-card-horizontal">
      <h3>⏱️ Study Timers</h3>
      <div style="display: flex; align-items: center; justify-content: center; gap: 40px; flex-wrap: wrap;">
        
        <div style="display: flex; align-items: center; gap: 15px;">
          <div style="text-align: left;">
            <div style="font-size: 11px; color: #aaa;">Target</div>
            <div style="display: flex; align-items: center; gap: 8px;">
              <input type="number" id="targetMins" value="25" style="width: 50px;">
              <div id="targetDisplay" style="font-size: 24px; font-weight: bold; font-family: monospace;">25:00</div>
            </div>
          </div>
          <button id="startT" class="btn-start" onclick="TimerEngine.startTarget()">START</button>
          <button id="stopT" class="btn-stop" onclick="TimerEngine.stopTarget()">STOP</button>
          <div class="cup-container"><div id="targetTea" class="tea-fill" style="height: 0%;"></div></div>
        </div>

        <div style="display: flex; align-items: center; gap: 15px;">
          <div style="text-align: left;">
            <div style="font-size: 11px; color: #aaa;">Stopwatch</div>
            <div id="openDisplay" style="font-size: 24px; font-weight: bold; font-family: monospace;">00:00:00</div>
          </div>
          <button id="startO" class="btn-start" onclick="TimerEngine.startOpen()">START</button>
          <button id="stopO" class="btn-stop" onclick="TimerEngine.stopOpen()">STOP</button>
          <div class="cup-container"><div id="openTea" class="tea-fill" style="height: 0%;"></div></div>
        </div>
      </div>
    </div>

    <!-- DAILY GOAL -->
    <div class="card">
      <h3>🎯 Daily Goal</h3>
      <div class="gauge-wrapper">
        <svg width="300" height="300" style="transform: scaleY(-1);">
          <circle id="liquidFill" class="gauge-liquid" cx="150" cy="150" r="120"></circle>
          <circle class="gauge-bg" cx="150" cy="150" r="120"></circle>
          <clipPath id="gaugeClip"><rect id="liquidLevel" x="0" y="0" width="300" height="0" /></clipPath>
          <circle cx="150" cy="150" r="120" fill="url(#gaugeClip)" />
        </svg>
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);">
          <span id="goalPercent" style="font-size: 40px; font-weight: bold;">0</span>%
        </div>
      </div>
      <div style="margin-top: 10px;">
        <input type="number" id="goalInput" value="4" step="0.5" style="width: 50px;"> hrs
        <button onclick="DB.setGoal()" style="display: inline-block; padding: 5px 10px;">Save</button>
      </div>
    </div>

    <!-- 24H WATCH -->
    <div class="card">
      <h3>⏰ 24h Study Watch</h3>
      <svg id="watch24h" width="280" height="280" viewBox="0 0 280 280">
        <circle cx="140" cy="140" r="130" fill="#f8f9fa" stroke="#eee" />
        <g id="watchSegments"></g>
        <circle cx="140" cy="140" r="60" fill="white" />
        <text id="watchTotal" x="140" y="145" text-anchor="middle" font-size="24" font-weight="bold" fill="#4285f4">0h</text>
      </svg>
    </div>

    <!-- SCHEDULE -->
    <div class="card">
      <h3>📅 Today's Schedule</h3>
      <input type="time" id="endTimeInput" onchange="UI.renderSchedule()">
      <div id="scheduleContainer"></div>
    </div>

    <!-- CHARTS -->
    <div class="card" style="grid-column: span 2; max-width: 100%;">
      <h3>📊 History (Last 7 Days)</h3>
      <div id="chart_weekly" style="height: 250px;"></div>
    </div>

    <div class="card">
      <h3>🔥 Consistency</h3>
      <div id="heatmapGrid" class="heatmap-grid"></div>
    </div>

    <div class="card" style="grid-column: 1 / -1; max-width: 100%;">
        <button onclick="DB.exportData()" style="margin: 0 auto;">📥 Download Backup (JSON)</button>
    </div>

  </div>

  <script>
   /* ================= LOCAL STORAGE DATABASE ENGINE ================= */
const DB = {
  get: (key, def) => JSON.parse(localStorage.getItem(key)) || def,
  save: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
  
  // Log a new session
  logSession: (type, durationStr, targetMins) => {
    let logs = DB.get('study_logs', []);
    const [m, s] = durationStr.split(':').map(Number);
    const hrs = (m * 60 + s) / 3600;
    logs.push({ 
      timestamp: Date.now(), 
      type, 
      hrs, 
      target: parseFloat(targetMins) || 0 
    });
    DB.save('study_logs', logs);
    refreshAll();
  }
};

/* ================= TIMER LOGIC ================= */
let targetInt, openInt, targetSecs = 0, openSecs = 0, initialTargetSecs = 0;
let targetEndTime, openStartTime;

function saveGoal() {
  const newGoal = parseFloat(document.getElementById('goalInput').value);
  DB.save('daily_goal', newGoal);
  refreshAll();
  alert('Goal updated!');
}

function resetTargetDisplay() {
  const mins = document.getElementById('targetMins').value;
  document.getElementById('targetDisplay').innerText = `${mins.toString().padStart(2, '0')}:00`;
}

function startTarget(isRestoring = false) {
  if (targetInt) clearInterval(targetInt);
  document.body.classList.add('timer-running');
  const minsInput = document.getElementById('targetMins').value;
  if (!isRestoring) {
    initialTargetSecs = minsInput * 60;
    targetEndTime = Date.now() + (initialTargetSecs * 1000);
    DB.save('target_state', { start: Date.now(), dur: initialTargetSecs });
  }
  toggleButtons('T', true);
  targetInt = setInterval(() => {
    targetSecs = Math.ceil((targetEndTime - Date.now()) / 1000);
    let progress = ((initialTargetSecs - targetSecs) / initialTargetSecs) * 100;
    document.getElementById('targetTea').style.height = Math.min(100, progress) + '%';
    if (targetSecs <= 0) { stopTarget(); } 
    else { document.getElementById('targetDisplay').innerText = fmt(targetSecs); }
  }, 500);
}

function stopTarget() {
  clearInterval(targetInt); targetInt = null;
  document.body.classList.remove('timer-running');
  const spent = Math.max(0, initialTargetSecs - targetSecs);
  const logDuration = fmt(spent);
  DB.logSession("Target", logDuration, document.getElementById('targetMins').value);
  DB.save('target_state', null);
  resetTargetDisplay();
  toggleButtons('T', false);
}

function startOpen(isRestoring = false) {
  if (openInt) clearInterval(openInt);
  document.body.classList.add('timer-running');
  if (!isRestoring) { openStartTime = Date.now(); DB.save('open_state', openStartTime); }
  toggleButtons('O', true);
  openInt = setInterval(() => {
    openSecs = Math.floor((Date.now() - openStartTime) / 1000);
    document.getElementById('openTea').style.height = ((openSecs % 3600) / 3600 * 100) + '%';
    document.getElementById('openDisplay').innerText = fmt(openSecs, true);
  }, 500);
}

function stopOpen() {
  clearInterval(openInt); openInt = null;
  document.body.classList.remove('timer-running');
  DB.logSession("Open", fmt(openSecs), 0);
  DB.save('open_state', null);
  document.getElementById('openDisplay').innerText = "00:00:00";
  toggleButtons('O', false);
}

/* ================= ANALYTICS & VISUALS ================= */
function refreshAll() {
  loadGoalGauge();
  load24HourWatch();
  loadChartDaily();
  loadChartWeekly();
  loadHeatmap();
  generateSchedule();
}

function loadGoalGauge() {
  const goal = DB.get('daily_goal', 4);
  const logs = DB.get('study_logs', []);
  const todayStr = new Date().toDateString();
  const sessions = logs.filter(l => new Date(l.timestamp).toDateString() === todayStr).map(l => l.hrs);
  const total = sessions.reduce((a, b) => a + b, 0);
  const percent = Math.min(100, Math.round((total / goal) * 100));
  
  document.getElementById('goalPercent').innerText = percent;
  document.getElementById('liquidLevel').setAttribute('height', (percent * 3));
  document.getElementById('goalStatus').innerText = `${total.toFixed(1)} of ${goal}h done (${sessions.length} sessions)`;
  
  // Segment drawing
  const segGroup = document.getElementById('gaugeSegments');
  segGroup.innerHTML = '';
  const circ = 2 * Math.PI * 120;
  let offset = 0;
  const colors = ['#4285f4', '#34a853', '#ea4335', '#fbbc05'];
  sessions.forEach((h, i) => {
    const dash = (h / goal) * circ;
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', '150'); c.setAttribute('cy', '150'); c.setAttribute('r', '120');
    c.setAttribute('stroke', colors[i % colors.length]);
    c.setAttribute('stroke-width', '60');
    c.setAttribute('stroke-dasharray', `${dash} ${circ}`);
    c.setAttribute('stroke-dashoffset', -offset);
    c.setAttribute('fill', 'none');
    segGroup.appendChild(c);
    offset += dash;
  });
}

function load24HourWatch() {
  const logs = DB.get('study_logs', []);
  const today = new Date().toDateString();
  const sessions = logs.filter(l => new Date(l.timestamp).toDateString() === today)
    .map(l => ({ 
      start: new Date(l.timestamp).getHours() + new Date(l.timestamp).getMinutes()/60, 
      hrs: l.hrs 
    }));

  let totalH = sessions.reduce((a,b) => a+b.hrs, 0);
  document.getElementById('watch24hTotal').innerText = totalH.toFixed(1) + 'h';
  
  const group = document.getElementById('hourSegments');
  group.innerHTML = '<circle cx="140" cy="140" r="130" fill="#f8f9fa" />';
  
  const colors = ['#4285f4', '#34a853', '#ea4335', '#fbbc05'];
  sessions.forEach((s, i) => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', getArc(s.start, s.hrs, 130, 80));
    path.setAttribute('fill', colors[i % colors.length]);
    group.appendChild(path);
  });
}

function getArc(sH, dH, out, inn) {
  const sA = (sH / 24) * 360 - 90;
  const eA = ((sH + dH) / 24) * 360 - 90;
  const sR = (sA * Math.PI) / 180;
  const eR = (eA * Math.PI) / 180;
  const large = (dH / 24) > 0.5 ? 1 : 0;
  return `M ${140+out*Math.cos(sR)} ${140+out*Math.sin(sR)} A ${out} ${out} 0 ${large} 1 ${140+out*Math.cos(eR)} ${140+out*Math.sin(eR)} L ${140+inn*Math.cos(eR)} ${140+inn*Math.sin(eR)} A ${inn} ${inn} 0 ${large} 0 ${140+inn*Math.cos(sR)} ${140+inn*Math.sin(sR)} Z`;
}

/* ================= CHART ADAPTERS ================= */
function loadChartDaily() {
  const logs = DB.get('study_logs', []);
  const today = new Date().toDateString();
  const todayLogs = logs.filter(l => new Date(l.timestamp).toDateString() === today);
  
  const data = [['Session', 'Hours', {role:'annotation'}]];
  todayLogs.forEach((l, i) => data.push([`S${i+1}`, l.hrs, (l.hrs*60).toFixed(0)+'m']));
  
  if (data.length > 1) {
    const chartData = google.visualization.arrayToDataTable(data);
    new google.visualization.ColumnChart(document.getElementById('chart_div_daily')).draw(chartData, { legend:'none', bar:{groupWidth:'70%'}, colors:['#4285f4'] });
  }
}

function loadChartWeekly() {
  const logs = DB.get('study_logs', []);
  const data = [['Day', 'Hours', {role:'annotation'}]];
  for(let i=6; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const dayStr = d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
    const h = logs.filter(l => new Date(l.timestamp).toDateString() === d.toDateString()).reduce((a,b)=>a+b.hrs, 0);
    data.push([dayStr, h, h > 0 ? h.toFixed(1)+'h' : '']);
  }
  const chartData = google.visualization.arrayToDataTable(data);
  new google.visualization.ColumnChart(document.getElementById('chart_div_weekly')).draw(chartData, { legend:'none', colors:['#34a853'] });
}

function loadHeatmap() {
  const logs = DB.get('study_logs', []);
  const grid = document.getElementById('heatmapGrid');
  grid.innerHTML = '';
  for(let i=181; i>=0; i--) {
    const d = new Date(); d.setDate(d.getDate()-i);
    const h = logs.filter(l => new Date(l.timestamp).toDateString() === d.toDateString()).reduce((a,b)=>a+b.hrs, 0);
    let lvl = h > 5 ? 4 : h > 3 ? 3 : h > 1 ? 2 : h > 0 ? 1 : 0;
    const div = document.createElement('div');
    div.className = `heatmap-day lvl-${lvl}`;
    grid.appendChild(div);
  }
}

/* ================= SCHEDULE LOGIC ================= */
function generateSchedule() {
  const endTimeInput = document.getElementById('endTimeInput').value;
  if (!endTimeInput) return;
  
  const goal = DB.get('daily_goal', 4);
  const logs = DB.get('study_logs', []);
  const done = logs.filter(l => new Date(l.timestamp).toDateString() === new Date().toDateString()).reduce((a,b)=>a+b.hrs, 0);
  const remain = Math.max(0, goal - done);
  
  const now = new Date();
  const [h, m] = endTimeInput.split(':').map(Number);
  let end = new Date(); end.setHours(h, m, 0);
  if (end < now) end.setDate(end.getDate() + 1);
  
  const availH = (end - now) / 3600000;
  const sessionCount = remain > 4 ? 4 : 3;
  const studyH = remain / sessionCount;
  
  let html = `<div class="schedule-info"><strong>${remain.toFixed(1)}h</strong> remaining.</div>`;
  let curr = new Date(now);
  for(let i=0; i<sessionCount; i++) {
    html += `<div class="schedule-row">
      <span style="font-weight:bold; color:#4285f4">${curr.getHours()}:${curr.getMinutes().toString().padStart(2,'0')}</span>
      <span class="schedule-block schedule-study">Session ${i+1}</span>
      <span>${(studyH*60).toFixed(0)}m</span>
    </div>`;
    curr.setMinutes(curr.getMinutes() + (studyH * 60) + 15);
  }
  document.getElementById('scheduleContainer').innerHTML = html;
}

/* ================= HELPERS & INIT ================= */
function fmt(s, hrs = false) {
  let h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sc = s % 60;
  let res = `${m.toString().padStart(2, '0')}:${sc.toString().padStart(2, '0')}`;
  return hrs ? `${h.toString().padStart(2, '0')}:${res}` : res;
}

function toggleButtons(group, isRunning) {
  document.getElementById('start' + group).disabled = isRunning;
  if (group === 'T') document.getElementById('targetMins').disabled = isRunning;
}

function setDefaultEndTime() {
  const d = new Date(); d.setHours(d.getHours() + 8);
  document.getElementById('endTimeInput').value = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  generateSchedule();
}

window.onload = function() {
  // Restore State
  const tState = DB.get('target_state', null);
  if (tState) {
    targetEndTime = tState.start + (tState.dur * 1000);
    initialTargetSecs = tState.dur;
    if (targetEndTime > Date.now()) startTarget(true);
  }
  const oState = DB.get('open_state', null);
  if (oState) { openStartTime = oState; startOpen(true); }

  document.getElementById('goalInput').value = DB.get('daily_goal', 4);
  google.charts.load('current', {packages:['corechart']});
  google.charts.setOnLoadCallback(refreshAll);
  setDefaultEndTime();
  
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
};
  </script>
</body>
</html>
